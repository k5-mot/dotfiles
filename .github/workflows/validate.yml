name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"

      - name: Enable pnpm
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tmux vim zsh

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository validation
        run: pnpm test

      - name: Validate shell scripts
        run: |
          bash -n dot_bash_profile dot_bashrc dot_config/env
          find dot_local/bin dot_local/script -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -r bash -n
          zsh -n dot_config/zsh/dot_zshrc dot_config/zsh/zinit.zsh
          find dot_local/script -type f -name '*.zsh' -print0 | xargs -0 -r zsh -n

      - name: Validate tmux config
        run: tmux -f /dev/null -L dotfiles-check start-server \; source-file -n dot_config/tmux/tmux.conf \; kill-server

      - name: Validate PowerShell profile
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("Documents/PowerShell/Profile.ps1", [ref]$null, [ref]$errors) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
