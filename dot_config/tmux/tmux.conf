### Shell {{{
## tmuxを256色表示できるようにする
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",$TERM:Tc"
## 全てのベルを無視
set-option -g bell-action none
## ESCキーの遅延を解消
set -sg escape-time 0
## ウィンドウのインデックスを1から始める
set -g base-index 1
## ペインのインデックスを1から始める
setw -g pane-base-index 1
## Synchronization
set-option -g synchronize-panes off
### }}}

### Keybindings {{{
## prefixキーをに変更
#set -g prefix C-q
set -g prefix C-s
## prefix <C-b> のキーバインドを解除
unbind-key C-s
bind-key C-s send-prefix
## Vimのキーバインドでペインを移動する
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R
## Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
## ペイン分割時に現在のディレクトリを引き継ぐ
bind | split-window -h -c "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
## windowを左右へ移動する
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
## Reload .tmux.conf
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"
## Synchronization
bind e setw synchronize-panes on
bind E setw synchronize-panes off
# コピーモードを設定する
# コピーモードでvimキーバインドを使う
setw -g mode-keys vi
# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection
# 'V' で行選択
bind -T copy-mode-vi V send -X select-line
# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle
# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# 'Y' で行ヤンク
#bind -T copy-mode-vi Y send -X copy-line
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# 'C-p'でペースト
bind-key C-p paste-buffer

### }}}

### Mouse {{{
# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
### }}}

### Plugin {{{
## インストール先
set-environment -g TMUX_HOME "${XDG_DATA_HOME}/tmux"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${TMUX_HOME}/plugins"
set-environment -g TPM_HOME "${TMUX_PLUGIN_MANAGER_PATH}/tpm"

## TPM本体がなければtmux起動時に導入し、同時にプラグインも入れる
if-shell 'test ! -d "${TPM_HOME}"' 'run-shell "git clone https://github.com/tmux-plugins/tpm ${TPM_HOME} && ${TPM_HOME}/bin/install_plugins"'

## プラグイン一覧
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'tmux-plugins/tmux-battery#v2.0.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'

## プラグイン設定
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text " %Y/%m/%d %H:%M:%S"

set -g @resurrect-dir '$HOME/.cache/tmux/resurrect'

set -g @continuum-save-interval '1'
set -g @continuum-restore 'off'

### Statusline {{{
# ステータスバーをトップに配置する
set-option -g status-position top
# status line を更新する間隔を 1 秒にする
set-option -g status-interval 1
### }}}

## TPMを読み込んだ後、Catppuccin moduleをstatuslineへ割り当てる
run "${TPM_HOME}/tpm"

set -g status-right-length 120
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
