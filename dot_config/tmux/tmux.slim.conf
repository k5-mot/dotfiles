### Shell {{{
## airgap環境で外部依存なしに動かすため、端末機能だけを設定する
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",$TERM:Tc"
## 全てのベルを無視
set-option -g bell-action none
## ESCキーの遅延を解消
set -sg escape-time 0
## ウィンドウのインデックスを1から始める
set -g base-index 1
## ペインのインデックスを1から始める
setw -g pane-base-index 1
## ペイン同期は明示的に有効化したときだけ使う
set-option -g synchronize-panes off
### }}}

### Keybindings {{{
## prefixキーを通常設定と揃える
set -g prefix C-s
unbind-key C-s
bind-key C-s send-prefix
## Vimのキーバインドでペインを移動する
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R
## Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
## ペイン分割時に現在のディレクトリを引き継ぐ
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
## windowを左右へ移動する
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
## slim設定を再読み込みする
bind r source-file ~/.config/tmux/tmux.slim.conf \; display "Reloaded tmux.slim.conf"
## ペイン同期を切り替える
bind e setw synchronize-panes on
bind E setw synchronize-panes off
### }}}

### Copy mode {{{
## クリップボード連携に外部コマンドを使わない
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key C-p paste-buffer
### }}}

### Mouse {{{
## マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
### }}}

### Statusline {{{
## プラグインなしで視認できる最小ステータスラインにする
set-option -g status-position top
set-option -g status-interval 5
set -g status-style "fg=colour250,bg=colour236"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour81,bold]#S #[fg=colour244]| "
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour81]%H:%M"
setw -g window-status-current-style "fg=colour236,bg=colour81,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
### }}}
